<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Ledger — Personal Expense Tracker</title>

        <!-- Fonts: serif display for the masthead, sans for UI, mono for figures -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="container">
            <!-- ===== Masthead ===== -->
            <header class="masthead">
                <div>
                    <span class="eyebrow">Personal Finance</span>
                    <h1>Ledger</h1>
                </div>
                <span class="today" id="today-label"></span>
            </header>

            <!-- ===== Monthly Summary Cards ===== -->
            <section class="summary" aria-label="Monthly summary">
                <div class="summary-card spent">
                    <div class="label">Total Spent</div>
                    <div class="value" id="summary-spent">0.00</div>
                </div>
                <div class="summary-card income">
                    <div class="label">Total Income</div>
                    <div class="value" id="summary-income">0.00</div>
                </div>
                <div class="summary-card balance">
                    <div class="label">Net Balance</div>
                    <div class="value" id="summary-balance">0.00</div>
                </div>
            </section>

            <!-- ===== Add / Edit Transaction Form ===== -->
            <section class="panel">
                <h2 id="form-title">Add Transaction</h2>
                <form id="tx-form" class="tx-form">
                    <div class="field">
                        <label for="amount">Amount</label>
                        <input
                            type="number"
                            id="amount"
                            name="amount"
                            step="0.01"
                            min="0.01"
                            required
                        />
                    </div>

                    <div class="field">
                        <label for="type">Type</label>
                        <select id="type" name="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="category">Category</label>
                        <!-- "category-select" class is populated with the fixed list by app.js -->
                        <select
                            id="category"
                            name="category"
                            class="category-select"
                            required
                        >
                            <option value="" disabled selected>
                                Select a category
                            </option>
                        </select>
                    </div>

                    <!-- Fix: European date format -->
                    <div class="field">
                        <label for="date">Date (DD/MM/YYYY)</label>
                        <input
                            type="text"
                            id="date"
                            name="date"
                            placeholder="DD/MM/YYYY"
                            pattern="\d{2}/\d{2}/\d{4}"
                            required
                        />
                    </div>

                    <div class="field note-field">
                        <label for="note">Note (optional)</label>
                        <input
                            type="text"
                            id="note"
                            name="note"
                            placeholder="e.g. Groceries at market"
                        />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            Add Transaction
                        </button>
                        <button
                            type="button"
                            id="cancel-edit"
                            class="btn-ghost"
                            hidden
                        >
                            Cancel Edit
                        </button>
                    </div>
                </form>
            </section>

            <!-- ===== Filter Bar ===== -->
            <section class="panel">
                <h2>Filter Transactions</h2>
                <div class="filter-bar">
                    <div class="field">
                        <label for="filter-category">Category</label>
                        <select id="filter-category" class="category-select">
                            <option value="">All categories</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="filter-start-date">from (dd/mm/yyyy)</label>
                        <input
                            type="text"
                            id="filter-start-date"
                            placeholder="dd/mm/yyyy"
                            pattern="\d{2}/\d{2}/\d{4}"
                        />
                    </div>

                    <div class="field">
                        <label for="filter-end-date">to (dd/mm/yyyy)</label>
                        <input
                            type="text"
                            id="filter-end-date"
                            placeholder="dd/mm/yyyy"
                            pattern="\d{2}/\d{2}/\d{4}"
                        />
                    </div>

                    <div class="field">
                        <label for="filter-min-amount">Min Amount</label>
                        <input
                            type="number"
                            id="filter-min-amount"
                            step="0.01"
                            min="0"
                        />
                    </div>

                    <div class="field">
                        <label for="filter-max-amount">Max Amount</label>
                        <input
                            type="number"
                            id="filter-max-amount"
                            step="0.01"
                            min="0"
                        />
                    </div>

                    <div class="field">
                        <button
                            type="button"
                            id="filter-clear"
                            class="btn-ghost"
                        >
                            Clear Filters
                        </button>
                    </div>
                </div>
            </section>

            <!-- ===== Transaction Table ===== -->
            <section class="panel">
                <h2>Transactions</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Type</th>
                            <th>Category</th>
                            <th class="amount-col">Amount</th>
                            <th>Note</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tx-table-body">
                        <!-- Rows are rendered here by app.js -->
                    </tbody>
                </table>
            </section>
        </div>

        <!-- api.js must load before app.js since app.js relies on window.api -->
        <script src="js/api.js"></script>
        <script src="js/app.js"></script>
        <script>
            // Small inline touch: shows today's date in the masthead corner.
            document.getElementById("today-label").textContent =
                new Date().toLocaleDateString(undefined, {
                    year: "numeric",
                    month: "long",
                    day: "numeric",
                });
        </script>
    </body>
</html>
